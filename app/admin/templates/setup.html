{% extends "base.html" %}

{% block title %}Setup Administrator — JARVIS Admin{% endblock %}

{% block auth_content %}
<h1>Initial Admin Setup</h1>
<p>Create your local administrator account to configure JARVIS.</p>

<form method="POST" action="{{ url_for('admin.setup') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-group">
    <label class="form-label" for="username">Admin Username</label>
    <input type="text" id="username" name="username" class="form-control" value="{{ username or '' }}" required autofocus placeholder="e.g. admin">
  </div>

  <div class="form-group">
    <label class="form-label" for="password">Password (Minimum 8 characters)</label>
    <input type="password" id="password" name="password" class="form-control" required minlength="8" placeholder="••••••••">
  </div>

  <div class="form-group">
    <label class="form-label" for="confirm_password">Confirm Password</label>
    <input type="password" id="confirm_password" name="confirm_password" class="form-control" required minlength="8" placeholder="••••••••">
  </div>

  <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
    Create Admin Account
  </button>
</form>
{% endblock %}
