{% extends "base.html" %}

{% block title %}Login — JARVIS Admin{% endblock %}

{% block auth_content %}
<h1>Admin Login</h1>
<p>Sign in to manage JARVIS contacts, web commands, and settings.</p>

<form method="POST" action="{{ url_for('admin.login', next=request.args.get('next')) }}">
  <div class="form-group">
    <label class="form-label" for="username">Username</label>
    <input type="text" id="username" name="username" class="form-control" value="{{ username or '' }}" required autofocus>
  </div>

  <div class="form-group">
    <label class="form-label" for="password">Password</label>
    <input type="password" id="password" name="password" class="form-control" required>
  </div>

  <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
    Sign In
  </button>
</form>
{% endblock %}
