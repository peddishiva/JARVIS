{% extends "base.html" %}

{% block title %}Login — JARVIS Admin{% endblock %}

{% block auth_content %}
<h1>Admin Login</h1>
<p>Sign in to manage JARVIS contacts, web shortcuts, and system controls.</p>

<form method="POST" action="{{ url_for('admin.login', next=request.args.get('next')) }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-group">
    <label class="form-label" for="username">Username</label>
    <input type="text" id="username" name="username" class="form-control" value="{{ username or '' }}" required autofocus placeholder="Enter admin username" autocomplete="username">
  </div>

  <div class="form-group">
    <label class="form-label" for="password">Password</label>
    <input type="password" id="password" name="password" class="form-control" required placeholder="••••••••" autocomplete="current-password">
  </div>

  <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px; justify-content: center;">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
      <polyline points="10 17 15 12 10 7"></polyline>
      <line x1="15" y1="12" x2="3" y2="12"></line>
    </svg>
    Sign In
  </button>
</form>
{% endblock %}
